# =========================================================
# APP
# =========================================================
spring.application.name=order_service
server.port=9009

# =========================================================
# EUREKA (Discovery)
# =========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# =========================================================
# DATABASE (MySQL)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_orders?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE (Hibernate 7 compatible)
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ❌ SUPPRIMÉ (obligatoire)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================================================
# OPENFEIGN
# =========================================================
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=10000
spring.cloud.openfeign.client.config.default.loggerLevel=basic

spring.cloud.openfeign.client.config.shipment-service.url=http://localhost:9001
spring.cloud.openfeign.client.config.tracking-service.url=http://localhost:9002

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================================================
# OPENAPI / SWAGGER (springdoc)
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cloud.openfeign=INFO
